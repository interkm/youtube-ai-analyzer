# Render.com 배포 설정
# Docker 환경에서 실행됨 (Dockerfile 사용)

services:
  - type: web
    name: youtube-ai-analyzer
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8001
      - key: GEMINI_API_KEY
        sync: false        # Render 대시보드에서 직접 입력
      - key: OPENROUTER_API_KEY
        sync: false        # Render 대시보드에서 직접 입력 (선택)
    healthCheckPath: /api
    autoDeploy: true       # GitHub push 시 자동 재배포
